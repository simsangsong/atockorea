<!doctype html>
<!--
  Smart Guide onboarding — pictogram animation v3 (howto-video track).

  High-end tech × fresh travel: white / cool-gray surfaces, deep navy ink,
  ocean-teal accents. v3 detail pass: duotone layered characters (hair, collar,
  driver cap), glazed van with mirrors and lamps, phones with screen insets and
  typing indicators, ticked clock with sweeping hands, soft shadows, micro
  animations (typing dots, pin ripples, check draw, bubble float, SOS pulse).

  Deterministic rendering contract (scripts/render-howto-video.mjs):
    window.__total, window.__seek(tMs) over paused WAAPI animations.
  Gotchas honored: fade-outs fill:'forwards' only; animated nodes never carry
  their own transform attribute (translate lives on a wrapper <g>); fills on
  .pict strokes must be inline style (CSS class fill:none wins over attrs).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --surface: #ffffff;
    --page-edge: #e9edf2;
    --screen: #f2f6fa;      /* phone screen inset */
    --glass: #d9edf5;       /* van glazing */
    --ink: #14294b;         /* deep navy */
    --ink-deep: #0c1c33;    /* hair, tires */
    --ink-2: #5a6b81;       /* slate subcopy */
    --teal: #1a9db4;        /* ocean teal accent */
    --teal-deep: #0d5f74;
    --teal-soft: #bfe2ec;
    --safe: #c0392b;
    --shadow: rgba(20, 41, 75, 0.10);
  }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(140% 90% at 50% 8%, #fbfcfe 55%, var(--page-edge) 100%);
    font-family: 'Segoe UI', -apple-system, sans-serif;
    color: var(--ink);
  }
  .stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .art { position: absolute; top: 330px; left: 0; width: 1080px; height: 980px; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .kicker {
    position: absolute; top: 200px; width: 100%; text-align: center;
    font-size: 34px; font-weight: 600; letter-spacing: 0.42em;
    text-transform: uppercase; color: var(--teal);
  }
  .caption { position: absolute; top: 1370px; width: 100%; text-align: center; }
  .caption h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 88px; font-weight: 500; line-height: 1.14; letter-spacing: -0.01em;
  }
  .caption p { margin-top: 26px; font-size: 42px; color: var(--ink-2); letter-spacing: 0.01em; }
  .rule { width: 96px; height: 3px; background: var(--teal); margin: 0 auto 34px; border-radius: 2px; }
  .stepdots { position: absolute; bottom: 130px; width: 100%; display: flex; justify-content: center; gap: 22px; }
  .stepdots i { width: 14px; height: 14px; border-radius: 50%; background: #ccd5de; }
  .stepdots i.on { background: var(--teal); }

  .pict { fill: none; stroke: var(--ink); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
  .pict-thin { stroke-width: 9; }
  .bubble-label { font-family: 'Segoe UI', sans-serif; font-weight: 600; fill: #fff; }
  .chip-label { font-family: 'Segoe UI', sans-serif; font-weight: 700; letter-spacing: 0.18em; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
/* ───────────────────────── timeline ───────────────────────── */
const SCENE = 5500, XFADE = 500, STEP = SCENE - XFADE;
const N = 6;
const TOTAL = STEP * (N - 1) + SCENE;
window.__total = TOTAL;

const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
const anims = [];
function an(el, frames, opt) {
  const a = el.animate(frames, { fill: 'both', easing: EASE, ...opt });
  a.pause();
  anims.push(a);
  return a;
}
window.__seek = (t) => { anims.forEach((a) => { a.currentTime = t; }); };

function scene(i, { kicker, title, sub, art }) {
  const t0 = i * STEP;
  const el = document.createElement('div');
  el.className = 'scene';
  el.innerHTML = `
    <div class="kicker">${kicker}</div>
    <div class="art">${art}</div>
    <div class="caption"><div class="rule"></div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>
    <div class="stepdots">${Array.from({ length: N }, (_, d) => `<i class="${d === i ? 'on' : ''}"></i>`).join('')}</div>`;
  document.getElementById('stage').appendChild(el);

  an(el, [{ opacity: 0 }, { opacity: 1 }], { delay: t0, duration: XFADE, easing: 'ease-in-out' });
  if (i < N - 1)
    an(el, [{ opacity: 1 }, { opacity: 0 }], { delay: t0 + STEP, duration: XFADE, easing: 'ease-in-out', fill: 'forwards' });

  an(el.querySelector('.caption'),
    [{ transform: 'translateY(46px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }],
    { delay: t0 + 350, duration: 900 });
  an(el.querySelector('.kicker'), [{ opacity: 0 }, { opacity: 1 }], { delay: t0 + 150, duration: 700 });
  return { el, t0 };
}

/* animation helpers (animated node must NOT carry a transform attribute) */
const drift = (el, t0, { from = 'translateY(60px)', dur = 1000, delay = 0 } = {}) =>
  an(el, [{ transform: from, opacity: 0 }, { transform: 'translate(0,0)', opacity: 1 }], { delay: t0 + delay, duration: dur });
const pop = (el, t0, delay, dur = 600) =>
  an(el, [
    { transform: 'scale(0)', opacity: 0 },
    { transform: 'scale(1.06)', opacity: 1, offset: 0.7 },
    { transform: 'scale(1)', opacity: 1 },
  ], { delay: t0 + delay, duration: dur });
const draw = (el, t0, delay, dur = 900) => {
  const len = el.getTotalLength ? el.getTotalLength() : 300;
  el.style.strokeDasharray = len;
  an(el, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { delay: t0 + delay, duration: dur });
};
const float = (el, t0, delay, amp = 7, period = 2600) =>
  an(el, [
    { transform: 'translateY(0px)' },
    { transform: `translateY(${-amp}px)` },
    { transform: 'translateY(0px)' },
  ], { delay: t0 + delay, duration: period, iterations: Infinity, easing: 'ease-in-out' });

/* ───────────── pictogram library (viewBox 1080x980) ───────────── */
const GROUND = (x, y, w) =>
  `<ellipse cx="${x}" cy="${y}" rx="${w / 2}" ry="${w * 0.055}" style="fill:var(--shadow)"/>`;

/* Detailed phone: navy shell, screen inset, camera dot, home indicator. */
const PHONE = (x, y, s = 1, inner = '') => `
  <g transform="translate(${x} ${y}) scale(${s})">
    <rect x="0" y="0" width="330" height="640" rx="54" style="fill:var(--ink)"/>
    <rect x="12" y="12" width="306" height="616" rx="44" style="fill:var(--surface)"/>
    <rect x="26" y="58" width="278" height="520" rx="30" style="fill:var(--screen)"/>
    <circle cx="165" cy="36" r="7" style="fill:var(--ink)"/>
    <rect x="120" y="598" width="90" height="7" rx="3.5" style="fill:#c3cdd8"/>
    ${inner}
  </g>`;

/* Shoulder-bust characters (airport-pictogram grammar), duotone layers:
   crescent hair / flat cap over the head, shirt-V collar, teal accents.
   Local space: ~200w × ~320h, base line at y=318. */
const GUEST_A = (x, y, s = 1) => `
  <g transform="translate(${x} ${y}) scale(${s})">
    ${GROUND(100, 322, 230)}
    <path d="M2 318 c0 -80 42 -124 98 -124 s98 44 98 124 z" style="fill:var(--ink)"/>
    <path d="M100 194 l-24 -22 h48 z" style="fill:#ffffff" opacity="0.92"/>
    <rect x="60" y="216" width="80" height="14" rx="7" style="fill:var(--teal)"/>
    <rect x="82" y="152" width="36" height="42" rx="13" style="fill:var(--ink)"/>
    <circle cx="100" cy="104" r="56" style="fill:var(--ink-deep)"/>
    <path d="M44 92 c-6 34 -2 56 2 66 c8 6 20 4 22 -4 c-4 -18 -4 -40 0 -58 z" style="fill:var(--ink-deep)"/>
    <path d="M156 92 c6 34 2 56 -2 66 c-8 6 -20 4 -22 -4 c4 -18 4 -40 0 -58 z" style="fill:var(--ink-deep)"/>
    <circle cx="104" cy="114" r="47" style="fill:var(--ink)"/>
  </g>`;
const GUEST_B = (x, y, s = 1) => `
  <g transform="translate(${x} ${y}) scale(${s})">
    ${GROUND(100, 322, 230)}
    <path d="M2 318 c0 -80 42 -124 98 -124 s98 44 98 124 z" style="fill:var(--teal-deep)"/>
    <path d="M100 194 l-24 -22 h48 z" style="fill:#ffffff" opacity="0.92"/>
    <rect x="60" y="216" width="80" height="14" rx="7" style="fill:var(--teal)"/>
    <rect x="82" y="152" width="36" height="42" rx="13" style="fill:var(--teal-deep)"/>
    <circle cx="150" cy="70" r="20" style="fill:var(--ink-deep)"/>
    <circle cx="100" cy="104" r="56" style="fill:var(--ink-deep)"/>
    <circle cx="97" cy="116" r="47" style="fill:var(--teal-deep)"/>
  </g>`;
const DRIVER = (x, y, s = 1) => `
  <g transform="translate(${x} ${y}) scale(${s})">
    ${GROUND(100, 322, 230)}
    <path d="M2 318 c0 -80 42 -124 98 -124 s98 44 98 124 z" style="fill:var(--ink)"/>
    <path d="M100 194 l-24 -22 h48 z" style="fill:#ffffff" opacity="0.92"/>
    <rect x="56" y="224" width="88" height="14" rx="7" style="fill:var(--teal)"/>
    <rect x="82" y="152" width="36" height="42" rx="13" style="fill:var(--ink)"/>
    <circle cx="100" cy="108" r="52" style="fill:var(--ink)"/>
    <path d="M50 96 a52 46 0 0 1 100 0 z" style="fill:var(--teal-deep)"/>
    <rect x="42" y="90" width="116" height="14" rx="7" style="fill:var(--teal-deep)"/>
    <rect x="128" y="92" width="46" height="11" rx="5.5" style="fill:var(--teal-deep)"/>
    <circle cx="100" cy="72" r="5" style="fill:var(--teal)"/>
  </g>`;

/* Detailed minivan (side view, facing right): glazing, mirror, lamps, hubs. */
const VAN = (x, y, s = 1) => `

    <path d="M14 210 h60" class="pict"/>
    <path d="M196 210 h230" class="pict"/>
    <rect x="52" y="106" width="104" height="64" rx="16" style="fill:var(--glass)"/>
    <rect x="176" y="106" width="104" height="64" rx="16" style="fill:var(--glass)"/>
    <path d="M312 108 c8 -2 26 4 34 12 l46 44 h-80 z" style="fill:var(--glass)"/>
    <path d="M300 96 v114" class="pict pict-thin" opacity="0.35"/>
    <rect x="300" y="150" width="26" height="10" rx="5" style="fill:var(--ink)" opacity="0.5"/>
    <rect x="12" y="150" width="18" height="26" rx="8" style="fill:var(--teal)"/>
    <rect x="580" y="176" width="30" height="14" rx="7" style="fill:var(--teal)"/>
    <g><circle cx="140" cy="212" r="46" style="fill:var(--ink-deep)"/><circle cx="140" cy="212" r="22" style="fill:var(--surface)"/><circle cx="140" cy="212" r="8" style="fill:var(--teal-deep)"/></g>
    <g><circle cx="470" cy="212" r="46" style="fill:var(--ink-deep)"/><circle cx="470" cy="212" r="22" style="fill:var(--surface)"/><circle cx="470" cy="212" r="8" style="fill:var(--teal-deep)"/></g>
  </g>`;

/* ── Scene 1 — title lockup ─────────────────────────────────── */
{
  const { el, t0 } = scene(0, {
    kicker: 'AtoC Smart Guide',
    title: 'Meet your<br/>Smart Guide',
    sub: 'Your whole tour, live on your phone',
    art: `
    <svg viewBox="0 0 1080 980">
      <circle cx="540" cy="440" r="360" style="fill:var(--teal-soft)" opacity="0.4"/>
      <g class="spark1"><path class="pict pict-thin" style="stroke:var(--teal)" d="M180 300 v40 m-20 -20 h40"/></g>
      <g class="spark2"><path class="pict pict-thin" style="stroke:var(--teal)" d="M905 250 v30 m-15 -15 h30"/></g>
      <g class="ph">
        <g>${PHONE(392, 60, 0.9, `
          <g class="msg1"><rect x="44" y="90" width="176" height="58" rx="26" style="fill:var(--teal-deep)"/>
            <path d="M56 144 l-8 22 l26 -14 z" style="fill:var(--teal-deep)"/>
            <text x="132" y="128" font-size="30" text-anchor="middle" class="bubble-label">Where next?</text></g>
          <g class="msg2"><rect x="104" y="176" width="182" height="58" rx="26" style="fill:var(--teal)"/>
            <path d="M274 230 l8 22 l-26 -14 z" style="fill:var(--teal)"/>
            <text x="195" y="214" font-size="30" text-anchor="middle" class="bubble-label">Seongsan!</text></g>
          <g class="typing"><rect x="44" y="262" width="104" height="54" rx="26" style="fill:#dfe7ee"/>
            <circle class="td" cx="74" cy="289" r="7" style="fill:var(--ink-2)"/>
            <circle class="td" cx="96" cy="289" r="7" style="fill:var(--ink-2)"/>
            <circle class="td" cx="118" cy="289" r="7" style="fill:var(--ink-2)"/></g>
          <g class="mapline"><path class="pict-thin" style="stroke:var(--teal);fill:none;stroke-dasharray:4 16;stroke-linecap:round" d="M60 480 c60 -50 140 10 210 -40"/>
            <circle cx="60" cy="480" r="10" style="fill:var(--teal-deep)"/>
            <path d="M270 414 c-14 0 -24 10 -24 23 c0 16 24 37 24 37 s24 -21 24 -37 c0 -13 -10 -23 -24 -23 z" style="fill:var(--teal)"/></g>
        `)}</g>
      </g>
      <g class="van"><g>${VAN(210, 640, 0.94)}</g></g>
    </svg>`,
  });
  drift(el.querySelector('.ph'), t0, { from: 'translateY(80px)', dur: 1100, delay: 300 });
  float(el.querySelector('.ph'), t0, 1500);
  drift(el.querySelector('.van'), t0, { from: 'translateX(-160px)', dur: 1300, delay: 600 });
  pop(el.querySelector('.msg1'), t0, 1250);
  pop(el.querySelector('.msg2'), t0, 1600);
  pop(el.querySelector('.typing'), t0, 1950);
  el.querySelectorAll('.td').forEach((d, i) =>
    an(d, [{ opacity: 0.25 }, { opacity: 1 }, { opacity: 0.25 }],
      { delay: t0 + 2200 + i * 180, duration: 900, iterations: Infinity, easing: 'ease-in-out' }));
  drift(el.querySelector('.mapline'), t0, { from: 'translateY(20px)', dur: 700, delay: 2400 });
  pop(el.querySelector('.spark1'), t0, 2000, 500);
  pop(el.querySelector('.spark2'), t0, 2300, 500);
}

/* ── Scene 2 — scan the QR at pickup ────────────────────────── */
{
  const { el, t0 } = scene(1, {
    kicker: 'Step One',
    title: 'Scan the QR<br/>at pickup',
    sub: 'No app install — it opens in your browser',
    art: `
    <svg viewBox="0 0 1080 980">
      <circle cx="540" cy="450" r="340" style="fill:var(--teal-soft)" opacity="0.35"/>
      <g class="card">
        ${GROUND(340, 800, 380)}
        <rect x="150" y="220" width="380" height="520" rx="30" style="fill:var(--surface)" class="pict"/>
        <text x="212" y="292" font-size="26" class="chip-label" style="fill:var(--teal)">ATOC KOREA</text>
        <g transform="translate(212 330)">
          ${[[0,0],[176,0],[0,176]].map(([qx,qy]) => `
            <g transform="translate(${qx} ${qy})"><g class="q">
              <rect class="pict pict-thin" x="0" y="0" width="80" height="80" rx="16"/>
              <rect x="24" y="24" width="32" height="32" rx="8" style="fill:var(--ink)"/>
            </g></g>`).join('')}
          ${[[112,8],[136,58],[200,112],[112,112],[152,152],[222,200],[112,222],[58,120],[8,118],[200,60],[226,8]]
            .map(([qx,qy]) => `<rect class="q" x="${qx}" y="${qy}" width="24" height="24" rx="6" style="fill:var(--ink)"/>`).join('')}
        </g>
        <rect x="212" y="636" width="256" height="9" rx="4.5" style="fill:#c3cdd8"/>
        <rect x="212" y="672" width="176" height="9" rx="4.5" style="fill:#c3cdd8"/>
      </g>
      <g class="ph2">
        <g>${PHONE(640, 300, 0.84, `
          <g class="scanframe">
            <path class="pict" style="stroke:var(--teal)" d="M70 190 h-24 a10 10 0 0 1 -10 -10 v-24"/>
            <path class="pict" style="stroke:var(--teal)" d="M260 190 h24 a10 10 0 0 0 10 -10 v-24"/>
            <path class="pict" style="stroke:var(--teal)" d="M70 330 h-24 a10 10 0 0 0 -10 10 v24"/>
            <path class="pict" style="stroke:var(--teal)" d="M260 330 h24 a10 10 0 0 1 10 10 v24"/>
          </g>
          <g class="checkwrap">
            <circle cx="165" cy="262" r="64" style="fill:var(--teal-deep)"/>
            <path class="checkpath pict" style="stroke:#ffffff" d="M132 262 l24 26 l44 -50"/>
          </g>
        `)}</g>
      </g>
      <g class="beam"><path class="pict pict-thin" style="stroke:var(--teal);stroke-dasharray:2 24" d="M545 470 L650 500"/></g>
    </svg>`,
  });
  drift(el.querySelector('.card'), t0, { from: 'translateY(70px)', dur: 1000, delay: 300 });
  drift(el.querySelector('.ph2'), t0, { from: 'translateX(120px)', dur: 1000, delay: 650 });
  el.querySelectorAll('.q').forEach((r, i) => pop(r, t0, 1000 + i * 70, 360));
  an(el.querySelector('.beam'), [{ opacity: 0 }, { opacity: 1 }], { delay: t0 + 1900, duration: 400 });
  pop(el.querySelector('.scanframe'), t0, 1800, 500);
  pop(el.querySelector('.checkwrap'), t0, 2700, 600);
  draw(el.querySelector('.checkpath'), t0, 3000, 500);
}

/* ── Scene 3 — chat in any language ─────────────────────────── */
{
  const { el, t0 } = scene(2, {
    kicker: 'Live Translation',
    title: 'Chat in<br/>any language',
    sub: 'Translated live — both ways',
    art: `
    <svg viewBox="0 0 1080 980">
      <circle cx="540" cy="450" r="340" style="fill:var(--teal-soft)" opacity="0.4"/>
      <g class="pA"><g>${GUEST_A(160, 520, 1.42)}</g></g>
      <g class="pB"><g>${DRIVER(730, 520, 1.42)}</g></g>
      <g class="b1w"><g class="b1">
        <rect x="140" y="260" width="310" height="112" rx="44" style="fill:var(--ink)"/>
        <path d="M230 364 l-20 52 l62 -44 z" style="fill:var(--ink)"/>
        <text x="295" y="333" font-size="52" text-anchor="middle" class="bubble-label">Hola!</text>
        <g transform="translate(160 388)"><rect width="66" height="40" rx="12" style="fill:var(--teal-soft)"/>
          <text x="33" y="28" font-size="24" text-anchor="middle" class="chip-label" style="fill:var(--teal-deep)">ES</text></g>
      </g></g>
      <g class="arrows">
        <path class="a1 pict" style="stroke:var(--teal)" d="M478 316 h110 m0 0 l-30 -30 m30 30 l-30 30"/>
        <path class="a2 pict" style="stroke:var(--teal)" d="M600 452 h-110 m0 0 l30 -30 m-30 30 l30 30"/>
      </g>
      <g class="b2w"><g class="b2">
        <rect x="620" y="260" width="340" height="112" rx="44" style="fill:var(--teal-deep)"/>
        <path d="M868 364 l20 52 l-62 -44 z" style="fill:var(--teal-deep)"/>
        <text x="790" y="336" font-size="50" text-anchor="middle" class="bubble-label">안녕하세요</text>
        <g transform="translate(874 388)"><rect width="70" height="40" rx="12" style="fill:var(--teal-soft)"/>
          <text x="35" y="28" font-size="24" text-anchor="middle" class="chip-label" style="fill:var(--teal-deep)">KO</text></g>

    </svg>`,
  });
  drift(el.querySelector('.pA'), t0, { from: 'translateX(-80px)', dur: 900, delay: 300 });
  drift(el.querySelector('.pB'), t0, { from: 'translateX(80px)', dur: 900, delay: 450 });
  pop(el.querySelector('.b1'), t0, 900, 700);
  float(el.querySelector('.b1w'), t0, 1600, 6);
  draw(el.querySelector('.a1'), t0, 1600, 650);
  draw(el.querySelector('.a2'), t0, 1950, 650);
  pop(el.querySelector('.b2'), t0, 2500, 700);

}

/* ── Scene 4 — spot guides arrive automatically ─────────────── */
{
  const { el, t0 } = scene(3, {
    kicker: 'On Arrival',
    title: 'Spot guides arrive<br/>automatically',
    sub: 'Photos, stories and tips — in your language',
    art: `
    <svg viewBox="0 0 1080 980">
      <circle cx="540" cy="450" r="340" style="fill:var(--teal-soft)" opacity="0.35"/>
      <g class="ripples">
        <circle class="rip1" cx="540" cy="536" r="60" style="fill:none;stroke:var(--teal);stroke-width:8"/>
        <circle class="rip2" cx="540" cy="536" r="60" style="fill:none;stroke:var(--teal);stroke-width:6"/>
      </g>
      <g class="pin">
        <path d="M540 130 c-92 0 -154 64 -154 146 c0 106 154 260 154 260 s154 -154 154 -260 c0 -82 -62 -146 -154 -146 z" style="fill:var(--teal)"/>

        <circle cx="512" cy="248" r="12" style="fill:var(--teal)"/>
      </g>
      <g class="cardpop">
        ${GROUND(540, 906, 480)}
        <rect x="290" y="580" width="500" height="310" rx="30" style="fill:var(--surface)" class="pict"/>
        <rect x="326" y="616" width="190" height="140" rx="18" style="fill:var(--glass)"/>
        <path d="M338 736 l50 -62 l38 40 l50 -66 l42 88 z" style="fill:var(--teal-deep)"/>
        <circle cx="366" cy="652" r="15" style="fill:#f5c045"/>
        <g transform="translate(540 616)"><rect width="66" height="40" rx="12" style="fill:var(--teal-soft)"/>
          <text x="33" y="28" font-size="24" text-anchor="middle" class="chip-label" style="fill:var(--teal-deep)">EN</text></g>
        <rect x="540" y="672" width="212" height="12" rx="6" style="fill:var(--ink)" opacity="0.85"/>
        <rect x="540" y="706" width="180" height="9" rx="4.5" style="fill:#c3cdd8"/>

}

/* ── Scene 5 — countdown keeps everyone together ────────────── */
{
  const { el, t0 } = scene(4, {
    kicker: 'Free Time',
    title: 'A countdown keeps<br/>everyone together',

    <svg viewBox="0 0 1080 980">

        <circle cx="540" cy="380" r="220" style="fill:var(--surface)" class="pict"/>
        ${Array.from({ length: 12 }, (_, i) => {
          const a = (i * 30 - 90) * Math.PI / 180, major = i % 3 === 0;
          const r1 = major ? 178 : 190, r2 = 202;
          return `<line x1="${540 + r1 * Math.cos(a)}" y1="${380 + r1 * Math.sin(a)}"
                        x2="${540 + r2 * Math.cos(a)}" y2="${380 + r2 * Math.sin(a)}"
                        class="pict ${major ? '' : 'pict-thin'}" ${major ? '' : 'opacity="0.4"'}/>`;
        }).join('')}
        <circle class="ring" cx="540" cy="380" r="220" transform="rotate(-90 540 380)"
                style="fill:none;stroke:var(--teal);stroke-width:20;stroke-linecap:round"/>

        <g class="wC"><g>${GUEST_A(392, 644, 0.82)}</g></g>

      <g class="minivan"><g>${VAN(620, 700, 0.72)}</g></g>

  draw(el.querySelector('.ring'), t0, 500, 1700);
  an(el.querySelector('.handm'),
    [{ transform: 'rotate(0deg)', transformOrigin: '540px 380px' }, { transform: 'rotate(150deg)', transformOrigin: '540px 380px' }],
    { delay: t0 + 700, duration: 2000 });
  an(el.querySelector('.handh'),
    [{ transform: 'rotate(0deg)', transformOrigin: '540px 380px' }, { transform: 'rotate(28deg)', transformOrigin: '540px 380px' }],
    { delay: t0 + 700, duration: 2000 });
  drift(el.querySelector('.walkers'), t0, { from: 'translateX(-120px)', dur: 1500, delay: 1400 });
  ['.wA', '.wB', '.wC'].forEach((w, i) => float(el.querySelector(w), t0, 1400 + i * 200, 5, 1400));
  drift(el.querySelector('.minivan'), t0, { from: 'translateY(46px)', dur: 900, delay: 600 });
}

window.__seek(0);
</script>
