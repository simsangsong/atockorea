<!doctype html>
<!--
  Route-guide overlay layer — Haedong Yonggungsa, point 5/9 (temple panorama
  + ocean view). Rendered with - -alpha into transparent PNGs and composited
  over the graded footage by ffmpeg. Footage window on the 1080x1920 canvas:
  y 656..1264 (16:9 at width 1080). Caption block sits above it, watermark
  below, the route arrow inside the footage's lower third.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #14294b;
    --teal: #1a9db4;
    --teal-deep: #0d5f74;
  }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', -apple-system, sans-serif; }

  .kicker {
    position: absolute; top: 350px; width: 100%; text-align: center;
    font-size: 30px; font-weight: 700; letter-spacing: 0.38em;
    color: #ffffff; text-shadow: 0 2px 14px rgba(0,0,0,0.45);
  }
  .pointchip {
    position: absolute; top: 412px; width: 100%; text-align: center;
  }
  .pointchip span {
    display: inline-block; padding: 10px 26px; border-radius: 999px;
    background: rgba(13, 95, 116, 0.88); color: #fff;
    font-size: 28px; font-weight: 700; letter-spacing: 0.12em;
  }
  .title {
    position: absolute; top: 486px; width: 100%; text-align: center;
    color: #ffffff; text-shadow: 0 3px 18px rgba(0,0,0,0.5);
  }
  .title h1 {
    font-size: 76px; font-weight: 700; letter-spacing: -0.01em;
    font-family: Georgia, 'Malgun Gothic', serif;
  }
  .title p { margin-top: 12px; font-size: 36px; font-weight: 400; opacity: 0.94; }

  .watermark {
    position: absolute; top: 1300px; width: 100%; text-align: center;
    font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.78);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    letter-spacing: 0.02em;
  }
  .arrowlayer { position: absolute; inset: 0; }
  .arrowlayer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="kicker">HAEDONG YONGGUNGSA</div>
<div class="pointchip"><span>POINT 5 / 9</span></div>
<div class="title">
  <h1>사찰 전경 · 오션뷰</h1>
  <p>Temple panorama over the sea</p>
</div>

<div class="arrowlayer">
  <svg viewBox="0 0 1080 1920">
    <!-- route arrow: travel continues right toward the temple reveal -->
    <path class="arrowcasing" d="M250 1180 C 430 1130 650 1130 800 1168"
          style="fill:none;stroke:rgba(255,255,255,0.92);stroke-width:30;stroke-linecap:round"/>
    <path class="arrowbody" d="M250 1180 C 430 1130 650 1130 800 1168"
          style="fill:none;stroke:var(--teal);stroke-width:16;stroke-linecap:round"/>
    <g class="arrowhead">
      <path d="M800 1168 l-52 -34 m52 34 l-58 24"
            style="fill:none;stroke:rgba(255,255,255,0.92);stroke-width:30;stroke-linecap:round;stroke-linejoin:round"/>
      <path d="M800 1168 l-52 -34 m52 34 l-58 24"
            style="fill:none;stroke:var(--teal);stroke-width:16;stroke-linecap:round;stroke-linejoin:round"/>
    </g>
  </svg>
</div>

<div class="watermark">본 영상은 AtoC Korea의 자산입니다 · 무단 복제·배포 금지 · 위반 시 법적 책임을 물을 수 있습니다</div>

<script>
window.__total = 16500;
const anims = [];
function an(el, frames, opt) {
  const a = el.animate(frames, { fill: 'both', easing: 'cubic-bezier(0.22,1,0.36,1)', ...opt });
  a.pause(); anims.push(a); return a;
}
window.__seek = (t) => { anims.forEach((a) => { a.currentTime = t; }); };

// Caption block settles in early, stays.
for (const [sel, delay] of [['.kicker', 500], ['.pointchip', 700], ['.title', 900]]) {
  an(document.querySelector(sel),
    [{ transform: 'translateY(30px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }],
    { delay, duration: 900 });
}
// Watermark: constant from the first frame (asset-protection line never absent).
// Route arrow draws slowly (2.5s -> 8.5s), head pops as the line completes.
for (const sel of ['.arrowcasing', '.arrowbody']) {
  const el = document.querySelector(sel);
  const len = el.getTotalLength();
  el.style.strokeDasharray = len;
  an(el, [{ strokeDashoffset: len, opacity: 0.4 }, { strokeDashoffset: 0, opacity: 1 }],
    { delay: 2500, duration: 6000, easing: 'ease-in-out' });
}
an(document.querySelector('.arrowhead'),
  [{ transform: 'scale(0)', opacity: 0, transformOrigin: '800px 1168px' },
   { transform: 'scale(1.15)', opacity: 1, offset: 0.7, transformOrigin: '800px 1168px' },
   { transform: 'scale(1)', opacity: 1, transformOrigin: '800px 1168px' }],
  { delay: 8200, duration: 700 });
window.__seek(0);
</script>
</body>
</html>
